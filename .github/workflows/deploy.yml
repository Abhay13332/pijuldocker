name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] 
    tags:  
      - 'v*' # Fixed syntax: Added hyphen and new line

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Dynamically extracts 'latest' for main branch, and 'v5.0' for tags
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/pijulserv # Replace 'my-image' with your real repo name
        tags: |
          type=ref,event=branch
          type=ref,event=tag

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }} # Fixed: Automatically applies the correct version tag
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha 
        cache-to: type=gha,mode=max
