
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "pijul-reader"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
libpijul = {version = "1.0.0-beta.10", features = ["tarball"]}
[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
