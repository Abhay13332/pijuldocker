
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "pijul-reader"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
libpijul = {version = "1.0.0-beta.10", features = ["tarball"]}
dashmap = "6.2.1"
uuid = {version = "1.23.2" , features = ["v4"] }
lazy_static = "1.5.0"
rand = "0.10.1"
[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"

[dev-dependencies]
libpijul = "1.0.0-beta.10"
